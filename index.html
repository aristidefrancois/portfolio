<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aristide François — Architecte DE & Dessinateur</title>
    <meta name="description" content="Portfolios d'Aristide François, architecte DE et dessinateur.">

    <style>
        html {
            background: #fff;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: transparent;
            cursor: pointer;
        }

        /* Pile de dessins */
        .pile {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .sheet {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.8;                       /* opacité de chaque dessin */
            transition: transform 1s cubic-bezier(.5, 0, .3, 1);
            will-change: transform;
        }

        /* La feuille du dessus s'en va */
        .sheet.leave {
            transform: translateX(-110%) rotate(var(--rot, -3deg));
        }

        /* Carte "papier calque" */
        .card {
            display: inline-block;
            margin: 30px;
            padding: 28px 36px;
            color: #222;
            font-family: Arial, sans-serif;
            text-align: left;
            line-height: 1.4;
            cursor: auto;

            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0.07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
                rgba(233, 231, 232, 0.8);

            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);

            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
        }

        @media (max-width: 700px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: 100dvh;
            }

            .card {
                margin: 20px;
                padding: 22px 24px;
            }
        }

        .card h1 {
            margin: 0 0 4px 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .card .subtitle {
            margin: 0 0 16px 0;
            color: #555;
        }

        .card p {
            margin: 0 0 4px 0;
        }

        .card .separator {
            border: 0;
            border-top: 1px solid rgba(34, 34, 34, 0.7);
            margin: 16px 0;
        }

        .card a {
            color: #222;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="pile"></div>

    <div class="card">

        <h1>Aristide FRANÇOIS</h1>
        <p class="subtitle">Architecte DE &amp; Dessinateur</p>

        <hr class="separator">

        <p><a href="PORTFOLIO_ARCHITECTURE_Aristide-Francois.pdf" target="_blank" rel="noopener">Portfolio Architecture</a> (PDF)</p>
        <p><a href="PORTFOLIO_DESSIN_Aristide-Francois.pdf" target="_blank" rel="noopener">Portfolio Dessin</a> (PDF)</p>

        <hr class="separator">

        <p>aristidefrancois.ade@gmail.com</p>
        <p>
            <a href="https://www.instagram.com/aristide_francois_dessins/">Instagram</a> ·
            <a href="https://www.linkedin.com/in/aristide-fran%C3%A7ois-b62288417">LinkedIn</a>
        </p>

    </div>

    <script>
        const TOTAL = 10;       // nombre de dessins
        const DELAY = 6000;     // temps entre deux changements (ms)
        const DURATION = 1000;  // durée du glissement (ms), identique au CSS

        const mobile = window.matchMedia("(max-width: 700px)");
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const pile = document.querySelector(".pile");
        let order = [];         // du dessous (0) au dessus (dernier)
        let busy = false;
        let timer;

        function src(i) {
            return (mobile.matches ? "fond-mobile-" : "fond-pc-") + i + ".jpg";
        }

        function applyZ() {
            order.forEach(function (el, i) { el.style.zIndex = i; });
        }

        // Construit la pile : le dessin 1 est au-dessus
        function build() {
            pile.innerHTML = "";
            order = [];
            busy = false;
            for (let i = TOTAL; i >= 1; i--) {
                const el = document.createElement("div");
                el.className = "sheet";
                el.style.backgroundImage = 'url("' + src(i) + '")';
                pile.appendChild(el);
                order.push(el);
            }
            applyZ();
        }

        function next() {
            if (busy) return;
            busy = true;
            const top = order.pop();
            top.style.setProperty("--rot", (Math.random() * 6 - 3).toFixed(1) + "deg");
            top.classList.add("leave");

            setTimeout(function () {
                // La feuille repart instantanément tout en bas de la pile
                top.style.transition = "none";
                top.classList.remove("leave");
                order.unshift(top);
                applyZ();
                void top.offsetWidth;
                top.style.transition = "";
                busy = false;
            }, DURATION);
        }

        function startTimer() {
            clearInterval(timer);
            if (!reduced) timer = setInterval(next, DELAY);
        }

        build();
        startTimer();

        // Clic sur le fond (hors carte) : feuille suivante
        document.addEventListener("click", function (e) {
            if (e.target.closest(".card")) return;
            next();
            startTimer();
        });

        // Passage téléphone / ordinateur
        mobile.addEventListener("change", function () {
            build();
            startTimer();
        });
    </script>

</body>
</html>
