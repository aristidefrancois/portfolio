<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aristide François — Architecte DE & Dessinateur</title>
    <meta name="description" content="Portfolios d'Aristide François, architecte DE et dessinateur.">

    <style>
        html {
            background: #fff; /* secours si l'image ne charge pas */
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: transparent;
        }

        /* Fond ordinateur */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url("fond.jpg") center / cover no-repeat;
        }

        /* Fond smartphone */
        @media (max-width: 700px) {
            .bg {
                background-image: url("fond-mobile.jpg");
            }
        }

        .page {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 30px;
            text-align: center;
            color: #222;
        }

        /* Bande de surlignage derrière le texte */
        .hl {
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 12px;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
            line-height: 1.8;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-bottom: 60px;
        }

        .portfolio {
            display: block;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #222;
            background: transparent;
            text-decoration: none;
            color: #222;
            transition: color 0.2s;
        }

        .portfolio:hover .hl {
            background: #222;
            color: #fff;
        }

        .contact {
            margin-top: 70px;
        }

        .contact a {
            color: #222;
        }
    </style>
</head>

<body>

    <div class="bg"></div>

    <div class="page">

        <h1><span class="hl">Aristide FRANÇOIS</span></h1>

        <p class="subtitle"><span class="hl">Architecte DE &amp; Dessinateur</span></p>

        <a class="portfolio" href="PORTFOLIO_ARCHITECTURE_Aristide%20Fran%C3%A7ois.pdf">
            <span class="hl">Portfolio Architecture</span>
        </a>

        <a class="portfolio" href="PORTFOLIO_DESSIN_Aristide%20Fran%C3%A7ois.pdf">
            <span class="hl">Portfolio Dessin</span>
        </a>

        <div class="contact">
            <p><span class="hl">aristidefrancois.ade@gmail.com</span></p>
            <p>
                <span class="hl">
                    <a href="https://www.instagram.com/aristide_francois_dessins/">Instagram</a> ·
                    <a href="https://www.linkedin.com/in/aristide-fran%C3%A7ois-b62288417">LinkedIn</a>
                </span>
            </p>
        </div>

    </div>

</body>
</html>
