<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aristide François — Architecte DE & Dessinateur</title>
    <meta name="description" content="Portfolios d'Aristide François, architecte DE et dessinateur.">

    <style>
        html {
            background: #fff; /* secours si l'image ne charge pas */
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: transparent;
            cursor: pointer; /* le fond est cliquable */
        }

        /* Diaporama de fond */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .bg .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .bg .slide.active {
            opacity: 1;
        }

        /* Carte de visite, en haut à gauche */
        .card {
            display: inline-block;
            margin: 30px;
            padding: 28px 36px;
            background: #fff;
            color: #222;
            font-family: Arial, sans-serif;
            text-align: left;
            line-height: 1.4;
            cursor: auto;
        }

        /* Version mobile : carte centrée, blanche à 80 % */
        @media (max-width: 700px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: 100dvh;
            }

            .card {
                margin: 20px;
                padding: 22px 24px;
                background: rgba(255, 255, 255, 0.8);
            }
        }

        .card h1 {
            margin: 0 0 4px 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .card .subtitle {
            margin: 0 0 16px 0;
            color: #555;
        }

        .card p {
            margin: 0 0 4px 0;
        }

        .card .separator {
            border: 0;
            border-top: 1px solid #222;
            margin: 16px 0;
        }

        .card a {
            color: #222;
            cursor: pointer;
        }

        /* Règle parallèle et équerre (ordinateur uniquement) */
        .regle,
        .equerre {
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .regle,
            .equerre {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                pointer-events: none;   /* les clics passent à travers */
                opacity: 0;             /* invisible jusqu'au premier mouvement */
                will-change: transform;
            }

            /* Règle : pleine largeur, tuile répétée sans étirement */
            .regle {
                width: 100vw;
                height: 160px;
                background: url("regle.png") repeat-x left top;
                z-index: 100;
            }

            /* Équerre : pointe du crayon (800, 850 dans l'image) = position de la souris */
            .equerre {
                width: 1200px;
                height: 900px;
                margin: -850px 0 0 -800px;   /* -Y puis -X de la pointe */
                background: url("equerre.png") no-repeat;
                z-index: 101;
            }

            /* Le curseur n'est masqué que si les deux images sont chargées */
            .has-rule body,
            .has-rule .card,
            .has-rule .card a {
                cursor: none;
            }
        }
    </style>
</head>

<body>

    <div class="bg">
        <div class="slide"></div>
        <div class="slide"></div>
    </div>

    <div class="regle"></div>
    <div class="equerre"></div>

    <div class="card">

        <h1>Aristide FRANÇOIS</h1>
        <p class="subtitle">Architecte DE &amp; Dessinateur</p>

        <hr class="separator">

        <p><a href="PORTFOLIO_ARCHITECTURE_Aristide_Francois.pdf" target="_blank" rel="noopener">Portfolio Architecture</a> (PDF)</p>
        <p><a href="PORTFOLIO_DESSIN_Aristide_Francois.pdf" target="_blank" rel="noopener">Portfolio Dessin</a> (PDF)</p>

        <hr class="separator">

        <p>aristidefrancois.ade@gmail.com</p>
        <p>
            <a href="https://www.instagram.com/aristide_francois_dessins/">Instagram</a> ·
            <a href="https://www.linkedin.com/in/aristide-fran%C3%A7ois-b62288417">LinkedIn</a>
        </p>

    </div>

    <script>
        /* ---------- Diaporama ---------- */
        const TOTAL = 10;     // nombre d'images
        const DELAY = 6000;   // temps entre deux images (millisecondes)

        const mobile = window.matchMedia("(max-width: 700px)");
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const layers = document.querySelectorAll(".bg .slide");
        let index = 1;
        let front = 0;
        let request = 0;
        let timer;

        function src(i) {
            return (mobile.matches ? "fond-mobile-" : "fond-pc-") + i + ".jpg";
        }

        function show(i) {
            const id = ++request;
            const img = new Image();
            img.onload = function () {
                if (id !== request) return;
                const next = layers[1 - front];
                next.style.backgroundImage = 'url("' + src(i) + '")';
                next.classList.add("active");
                layers[front].classList.remove("active");
                front = 1 - front;
            };
            img.src = src(i);
        }

        function nextImage() {
            index = (index % TOTAL) + 1;
            show(index);
        }

        function startTimer() {
            clearInterval(timer);
            if (!reduced) {
                timer = setInterval(nextImage, DELAY);
            }
        }

        show(1);
        startTimer();

        // Clic sur le fond (hors carte) : image suivante
        document.addEventListener("click", function (e) {
            if (e.target.closest(".card")) return;
            nextImage();
            startTimer();
        });

        // Passage téléphone / ordinateur
        mobile.addEventListener("change", function () {
            index = 1;
            show(1);
        });

        /* ---------- Règle parallèle et équerre ---------- */
        const regle = document.querySelector(".regle");
        const equerre = document.querySelector(".equerre");
        const pointeurPrecis = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

        if (pointeurPrecis) {
            // Masque le curseur seulement si les deux PNG sont bien chargés
            let charges = 0;
            ["regle.png", "equerre.png"].forEach(function (nom) {
                const test = new Image();
                test.onload = function () {
                    charges++;
                    if (charges === 2) {
                        document.documentElement.classList.add("has-rule");
                    }
                };
                test.src = nom;
            });

            document.addEventListener("mousemove", function (e) {
                regle.style.transform = "translateY(" + e.clientY + "px)";
                equerre.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
                regle.style.opacity = 1;
                equerre.style.opacity = 1;
            });

            document.documentElement.addEventListener("mouseleave", function () {
                regle.style.opacity = 0;
                equerre.style.opacity = 0;
            });
        }
    </script>

</body>
</html>
