<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aristide François — Architecte DE & Dessinateur</title>
    <meta name="description" content="Portfolios d'Aristide François, architecte DE et dessinateur.">

    <style>
        html {
            background: #fff; /* secours si l'image ne charge pas */
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: transparent;
        }

        /* Diaporama de fond */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .bg .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease; /* durée du fondu */
        }

        .bg .slide.active {
            opacity: 1;
        }

        /* Carte de visite, en haut à gauche */
        .card {
            display: inline-block;
            margin: 30px;
            padding: 28px 36px;
            background: #fff;
            color: #222;
            font-family: Arial, sans-serif;
            text-align: left;
            line-height: 1.4;
        }

        /* Version mobile : carte centrée */
        @media (max-width: 700px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: 100dvh;
            }

            .card {
                margin: 20px;
                padding: 22px 24px;
            }
        }

        .card h1 {
            margin: 0 0 4px 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .card .subtitle {
            margin: 0 0 16px 0;
            color: #555;
        }

        .card p {
            margin: 0 0 4px 0;
        }

        .card .separator {
            border: 0;
            border-top: 1px solid #222;
            margin: 16px 0;
        }

        .card a {
            color: #222;
        }
    </style>
</head>

<body>

    <div class="bg">
        <div class="slide"></div>
        <div class="slide"></div>
    </div>

    <div class="card">

        <h1>Aristide FRANÇOIS</h1>
        <p class="subtitle">Architecte DE &amp; Dessinateur</p>

        <hr class="separator">

        <p><a href="PORTFOLIO_ARCHITECTURE_Aristide_Francois.pdf" target="_blank" rel="noopener">Portfolio Architecture</a> (PDF)</p>
        <p><a href="PORTFOLIO_DESSIN_Aristide_Francois.pdf" target="_blank" rel="noopener">Portfolio Dessin</a> (PDF)</p>

        <hr class="separator">

        <p>aristidefrancois.ade@gmail.com</p>
        <p>
            <a href="https://www.instagram.com/aristide_francois_dessins/">Instagram</a> ·
            <a href="https://www.linkedin.com/in/aristide-fran%C3%A7ois-b62288417">LinkedIn</a>
        </p>

    </div>

    <script>
        const TOTAL = 10;     // nombre d'images
        const DELAY = 6000;   // temps entre deux images (en millisecondes)

        const mobile = window.matchMedia("(max-width: 700px)");
        const layers = document.querySelectorAll(".bg .slide");
        let index = 1;
        let front = 0;

        function src(i) {
            return (mobile.matches ? "fond-mobile-" : "fond-pc-") + i + ".jpg";
        }

        function show(i) {
            const img = new Image();
            img.onload = function () {
                const next = layers[1 - front];
                next.style.backgroundImage = 'url("' + src(i) + '")';
                next.classList.add("active");
                layers[front].classList.remove("active");
                front = 1 - front;
            };
            img.src = src(i);
        }

        show(1);

        // Pas de défilement automatique si l'utilisateur a demandé moins d'animations
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            setInterval(function () {
                index = (index % TOTAL) + 1;
                show(index);
            }, DELAY);
        }

        // Si on passe de téléphone à ordinateur (rotation, redimensionnement)
        mobile.addEventListener("change", function () {
            index = 1;
            show(1);
        });
    </script>

</body>
</html>
